syntax = "proto3";
package api;
option java_package = "br.ufrn.dimap.api.grpc";
option java_multiple_files = true;

service GatewayService {
  rpc pulse(HeartbeatRequest) returns (HeartbeatResponse);
  rpc subscriber(SubscribeRequest) returns (SubscribeResponse);
  rpc getLiveNodes(LiveNodesRequest) returns (stream NodeInfoMessage);
}

message HeartbeatRequest {
  int64 nodeId = 1;
  string password = 2;
}

message HeartbeatResponse {
  bool success = 1;
}

message NodeInfoMessage {
  optional int64 id = 1;
  string address = 2;
  int32 udpPort = 3;
  int32 httpPort = 4;
  int32 grpcPort = 5;
  optional int32 configPort = 6;
  string prefix = 7;
}

message SubscribeRequest {
  NodeInfoMessage info = 1;
  string password = 2;
}

message SubscribeResponse{
  bool success = 1;
  int64 nodeId = 2;
}

message LiveNodesRequest {
  int64 nodeId = 1;
  string password = 2;
}